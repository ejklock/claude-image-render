name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag matches the plugin version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $version"; exit 1
          fi

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - run: claude plugin validate .
      - run: claude plugin test .

      - name: Package the plugin
        run: |
          zip -r "image-render-$GITHUB_REF_NAME.zip" \
            .claude-plugin/plugin.json .claude-plugin/marketplace.json \
            hooks assets LICENSE README.md

      - name: Release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          ```
          /plugin install image-render --marketplace ejklock/claude-image-render
          ```
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "image-render-$GITHUB_REF_NAME.zip" --title "image-render $GITHUB_REF_NAME" --notes-file notes.md
